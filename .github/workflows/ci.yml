name: CI

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Hygiene check
        run: python tests/hygiene_check.py
      - name: Smoke test
        shell: pwsh
        run: ./tests/smoke-test.ps1

  ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Syntax checks
        run: |
          bash -n install.sh uninstall.sh tests/smoke-test.sh
          python -m compileall hooks skills tests
      - name: Unit tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Hygiene check
        run: python tests/hygiene_check.py
      - name: Smoke test
        run: bash ./tests/smoke-test.sh
